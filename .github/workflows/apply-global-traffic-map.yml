name: Apply global traffic map fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'feat(traffic): show live map-wide traffic') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch global live traffic rendering
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          provider = Path('core/src/main/kotlin/com/haritalar/core/traffic/TomTomTrafficProvider.kt')
          s = provider.read_text()
          marker = '    private fun parseSegment(body: String, requestedPoint: GeoCoordinate): TrafficSegment? {'
          method = '''    /** Synchronous point query used by the map-wide traffic overlay. */
              fun fetchTrafficAtPointBlocking(point: GeoCoordinate): TrafficSegment? {
                  if (!supports(point)) return null
                  val fetchedAt = nowEpochMs()
                  if (fetchedAt <= 0L) return null
                  val key = SampleKey(
                      latitudeE6 = (point.latitude * 1_000_000.0).roundToIntSafely(),
                      longitudeE6 = (point.longitude * 1_000_000.0).roundToIntSafely(),
                  )
                  synchronized(cacheLock) {
                      cache[key]?.takeIf { it.expiresAtEpochMs > fetchedAt }?.segment
                  }?.let { return it }
                  val segment = runCatching { httpClient.fetch(point, apiKey, FLOW_ENDPOINT) }
                      .getOrNull()
                      ?.let { parseSegment(it, point) }
                  if (segment != null) {
                      synchronized(cacheLock) {
                          cache[key] = CachedSegment(segment, fetchedAt + cacheTtlMs)
                          cache.entries.removeIf { entry -> entry.value.expiresAtEpochMs <= fetchedAt }
                      }
                  }
                  return segment
              }

'''
          if 'fetchTrafficAtPointBlocking' not in s:
              s = s.replace(marker, method + marker, 1)
              provider.write_text(s)

          p = Path('app/src/main/java/com/haritalar/app/MainActivity.kt')
          s = p.read_text()
          s = s.replace(
              'import com.haritalar.core.traffic.TrafficRouteSegment\\n',
              'import com.haritalar.core.traffic.TrafficRouteSegment\\nimport com.haritalar.core.traffic.TrafficSegment\\n'
          )
          s = s.replace(
              'private const val TRAFFIC_ROUTE_LAYER_PREFIX = "haritalar-traffic-route-layer-"\\n',
              'private const val TRAFFIC_ROUTE_LAYER_PREFIX = "haritalar-traffic-route-layer-"\\n'
              '        private const val GLOBAL_TRAFFIC_SOURCE_PREFIX = "haritalar-global-traffic-source-"\\n'
              '        private const val GLOBAL_TRAFFIC_LAYER_PREFIX = "haritalar-global-traffic-layer-"\\n'
          )
          s = s.replace(
              'private var lastTrafficSegmentsByRoute: Map<String, List<TrafficRouteSegment>> = emptyMap()\\n',
              'private var lastTrafficSegmentsByRoute: Map<String, List<TrafficRouteSegment>> = emptyMap()\\n'
              '    private val mapTrafficProvider = TomTomTrafficProvider(BuildConfig.TOMTOM_API_KEY)\\n'
              '    private val mapTrafficRefreshInFlight = AtomicBoolean(false)\\n'
              '    private var lastMapTrafficRefreshAt = 0L\\n'
          )
          old = '''                map.addOnCameraIdleListener {
                      livePoiLayer?.scheduleRefresh(map.projection.visibleRegion.latLngBounds)
                  }'''
          new = '''                map.addOnCameraIdleListener {
                      livePoiLayer?.scheduleRefresh(map.projection.visibleRegion.latLngBounds)
                      refreshMapTraffic(map)
                  }'''
          if old in s:
              s = s.replace(old, new, 1)
          old2 = '''                livePoiLayer?.scheduleRefresh(map.projection.visibleRegion.latLngBounds)
            }
        }
        requestLocationPermission()'''
          new2 = '''                livePoiLayer?.scheduleRefresh(map.projection.visibleRegion.latLngBounds)
                refreshMapTraffic(map, force = true)
            }
        }
        requestLocationPermission()'''
          if old2 in s:
              s = s.replace(old2, new2, 1)
          marker2 = '    private fun decodePolyline6(encoded: String): List<LatLng> {'
          methods = r'''    /**
     * Draws live TomTom traffic for the visible map even when no route exists.
     * Flow Segment Data is point based, so a bounded grid samples the visible
     * viewport and renders the real provider segment geometry returned at each point.
     */
    private fun refreshMapTraffic(map: MapLibreMap, force: Boolean = false) {
        if (BuildConfig.TOMTOM_API_KEY.isBlank()) return
        val zoom = map.cameraPosition.zoom
        if (zoom < 11.0) return
        val now = System.currentTimeMillis()
        if (!force && now - lastMapTrafficRefreshAt < 60_000L) return
        if (!mapTrafficRefreshInFlight.compareAndSet(false, true)) return
        lastMapTrafficRefreshAt = now
        val bounds = map.projection.visibleRegion.latLngBounds
        val south = bounds.latitudeSouth
        val north = bounds.latitudeNorth
        val west = bounds.longitudeWest
        val east = bounds.longitudeEast
        routeExecutor.execute {
            try {
                val segments = fetchMapTrafficSegments(south, west, north, east, zoom)
                runOnUiThread {
                    map.style?.let { drawGlobalTrafficSegments(it, segments) }
                }
            } catch (e: Exception) {
                Log.w("MainActivity", "Harita geneli trafik yenilemesi başarısız", e)
            } finally {
                mapTrafficRefreshInFlight.set(false)
            }
        }
    }

    private fun fetchMapTrafficSegments(
        south: Double,
        west: Double,
        north: Double,
        east: Double,
        zoom: Double,
    ): List<TrafficSegment> {
        val rows = if (zoom >= 15.0) 4 else 3
        val cols = if (zoom >= 15.0) 4 else 3
        val points = buildList {
            for (r in 0 until rows) {
                val y = if (rows == 1) 0.5 else r.toDouble() / (rows - 1)
                for (c in 0 until cols) {
                    val x = if (cols == 1) 0.5 else c.toDouble() / (cols - 1)
                    add(GeoCoordinate(south + (north - south) * y, west + (east - west) * x))
                }
            }
        }
        return points.mapNotNull { point ->
            runCatching { mapTrafficProvider.fetchTrafficAtPointBlocking(point) }.getOrNull()
        }.distinctBy { segment ->
            segment.geometry.joinToString(";") { "%.5f,%.5f".format(it.latitude, it.longitude) }
        }
    }

    private fun drawGlobalTrafficSegments(style: Style, segments: List<TrafficSegment>) {
        TrafficRouteMapPresentation.Severity.values().forEach { severity ->
            val key = severity.name.lowercase(Locale.US)
            style.removeLayer(GLOBAL_TRAFFIC_LAYER_PREFIX + key)
            style.removeSource(GLOBAL_TRAFFIC_SOURCE_PREFIX + key)
        }
        TrafficRouteMapPresentation.Severity.values().forEach { severity ->
            val features = segments.filter { TrafficRouteMapPresentation.severityOf(it) == severity }.mapNotNull { segment ->
                if (segment.geometry.size < 2) return@mapNotNull null
                Feature.fromGeometry(LineString.fromLngLats(segment.geometry.map { point ->
                    org.maplibre.geojson.Point.fromLngLat(point.longitude, point.latitude)
                }))
            }
            if (features.isEmpty()) return@forEach
            val key = severity.name.lowercase(Locale.US)
            val sourceId = GLOBAL_TRAFFIC_SOURCE_PREFIX + key
            val layerId = GLOBAL_TRAFFIC_LAYER_PREFIX + key
            style.addSource(GeoJsonSource(sourceId, org.maplibre.geojson.FeatureCollection.fromFeatures(features)))
            style.addLayer(
                LineLayer(layerId, sourceId).withProperties(
                    lineWidth(6f),
                    lineColor(TrafficRouteMapPresentation.colorHex(severity)),
                ),
            )
        }
    }

'''
          if 'refreshMapTraffic(map: MapLibreMap' not in s:
              s = s.replace(marker2, methods + marker2, 1)
          p.write_text(s)

          log = Path('docs/PROJECT_ACTIVITY_LOG.md')
          text = log.read_text()
          entry = '''\n## İşlem #LIVE-TRAFFIC-MAP — Rota dışı canlı trafik katmanı\n\n- **Tarih:** 2026-09-10\n- **Tür:** Trafik UI / gerçek veri entegrasyonu\n- **Amaç:** Kullanıcı geri bildirimi üzerine canlı trafik renginin yalnız rota üzerinde değil, rota yokken de görünmesini sağlamak.\n- **Önceki gerçek durum:** v0.0.448 içinde trafik segmentleri yalnız route ranking sonucundan `drawRoute()` çağrısına aktarılıyordu; kullanıcı cihazında rota üzerinde dahi görsel değişiklik doğrulanmadı. Rota yokken trafik segment listesi zaten boştu.\n- **Yapılan değişiklik:** TomTom Flow Segment Data için görünür harita alanında bounded grid örneklemesi eklendi; gerçek provider geometrileri yeşil/sarı/turuncu/kırmızı katmanlar olarak MapLibre üzerinde rota bağımsız çizilecek. 30 saniyelik provider cache korunur; harita yenilemesi en erken 60 saniyede bir yapılır.\n- **Kısıt:** TomTom Flow Segment Data nokta tabanlı olduğundan görünür alanın tamamı tek HTTP isteğiyle değil, sınırlı örnek noktalarıyla taranır. Düşük zoom seviyesinde trafik sorgusu yapılmaz. Sahte trafik üretilmez.\n- **Test:** Kaynak değişikliği sonrası GitHub Actions Android build + instrumentation + canlı TomTom doğrulaması bekleniyor.\n- **Canlı kullanıcı doğrulaması:** BEKLİYOR — yeni APK henüz kullanıcı tarafından kontrol edilmedi.\n- **Sonraki adım:** Yeni APK'yı cihazda kontrol etmek; rota olmadan harita üzerinde gerçek trafik renklerinin görünmesini doğrulamak.\n'''
          if 'İşlem #LIVE-TRAFFIC-MAP' not in text:
              log.write_text(text.rstrip() + '\\n' + entry)
          PY

      - name: Commit and push patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-global-traffic-map.yml
          git add app/src/main/java/com/haritalar/app/MainActivity.kt core/src/main/kotlin/com/haritalar/core/traffic/TomTomTrafficProvider.kt docs/PROJECT_ACTIVITY_LOG.md .github/workflows/apply-global-traffic-map.yml
          git commit -m "feat(traffic): show live map-wide traffic"
          git push origin HEAD:main
