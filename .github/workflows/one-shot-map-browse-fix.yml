name: One-shot map browsing fix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/one-shot-map-browse-fix.yml'

permissions:
  contents: write
  actions: write

jobs:
  patch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch map browsing UI
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/src/main/java/com/haritalar/app/MainActivity.kt')
          text = path.read_text()

          text = text.replace(
              'import org.maplibre.android.maps.MapLibreMap\n',
              'import org.maplibre.android.maps.MapLibreMap\nimport org.maplibre.android.maps.MapLibreMapOptions\n'
          )
          text = text.replace(
              'private lateinit var navigationButton: Button\n',
              'private lateinit var navigationButton: Button\n    private lateinit var routeScroll: ScrollView\n'
          )
          text = text.replace(
              'private var routeGeneration = 0\n',
              'private var routeGeneration = 0\n    private var lastRouteInspectionTarget: LatLng? = null\n'
          )
          text = text.replace(
              'mapView = MapView(this)\n',
              '''mapView = MapView(this, MapLibreMapOptions()
                .scrollGesturesEnabled(true)
                .horizontalScrollGesturesEnabled(true)
                .zoomGesturesEnabled(true)
                .rotateGesturesEnabled(true)
                .tiltGesturesEnabled(true)
                .quickZoomGesturesEnabled(true)
                .build())
'''
          )
          text = text.replace(
              'val routeScroll = ScrollView(this).apply { isFillViewport = true; overScrollMode = View.OVER_SCROLL_IF_CONTENT_SCROLLS }',
              'routeScroll = ScrollView(this).apply { isFillViewport = true; overScrollMode = View.OVER_SCROLL_IF_CONTENT_SCROLLS; visibility = View.GONE; elevation = 12f }'
          )
          text = text.replace(
              'controls.addView(routeScroll, LinearLayout.LayoutParams(-1, 0, 1f).apply { topMargin = 10 })\n',
              ''
          )
          text = text.replace(
              'root.addView(controls, FrameLayout.LayoutParams(-1, -1).apply {\n            gravity = Gravity.TOP\n            topMargin = 34\n            leftMargin = 12\n            rightMargin = 12\n            bottomMargin = 12\n        })\n',
              '''root.addView(controls, FrameLayout.LayoutParams(-1, -2).apply {
            gravity = Gravity.TOP
            topMargin = 34
            leftMargin = 12
            rightMargin = 12
        })
        root.addView(routeScroll, FrameLayout.LayoutParams(-1, 330).apply {
            gravity = Gravity.BOTTOM
            leftMargin = 12
            rightMargin = 12
            bottomMargin = 12
        })
'''
          )
          marker = '''root.addView(status, FrameLayout.LayoutParams(-2, -2).apply {
            gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
            topMargin = 106
        })
'''
          replacement = marker + '''
        val myLocationButton = makeActionButton("⌖ Konumuma dön") {
            val location = lastLocation
            if (location == null) {
                status.text = "GPS konumu bekleniyor"
            } else {
                mapView.getMapAsync { map ->
                    map.cameraPosition = CameraPosition.Builder(map.cameraPosition)
                        .target(LatLng(location.latitude, location.longitude))
                        .zoom(max(map.cameraPosition.zoom, 15.5))
                        .tilt(0.0)
                        .build()
                }
                status.text = "Konumuma dönüldü • harita serbest"
            }
        }
        myLocationButton.textSize = 12f
        root.addView(myLocationButton, FrameLayout.LayoutParams(-2, 50).apply {
            gravity = Gravity.TOP or Gravity.END
            topMargin = 112
            rightMargin = 12
        })
'''
          if marker not in text:
              raise SystemExit('status insertion marker not found')
          text = text.replace(marker, replacement, 1)

          text = text.replace(
              'routePanel.visibility = View.VISIBLE\n        routePanel.removeAllViews()',
              'routePanel.visibility = View.VISIBLE\n        routeScroll.visibility = View.VISIBLE\n        routePanel.removeAllViews()',
              1
          )
          text = text.replace(
              'navigationActive = true\n            locationComponent?.let { NavigationLocationComponentController.apply(it, true) }\n            navigationButton.visibility = View.VISIBLE\n            routePanel.visibility = View.GONE',
              'navigationActive = true\n            locationComponent?.let { NavigationLocationComponentController.apply(it, true) }\n            navigationButton.visibility = View.VISIBLE\n            routePanel.visibility = View.GONE\n            routeScroll.visibility = View.GONE'
          )
          text = text.replace(
              'navigationActive = true\n        navigationEngine.reset()\n        locationComponent?.let { NavigationLocationComponentController.apply(it, true) }\n        navigationButton.visibility = View.VISIBLE\n        routePanel.visibility = View.GONE',
              'navigationActive = true\n        navigationEngine.reset()\n        locationComponent?.let { NavigationLocationComponentController.apply(it, true) }\n        navigationButton.visibility = View.VISIBLE\n        routePanel.visibility = View.GONE\n        routeScroll.visibility = View.GONE'
          )
          text = text.replace(
              'navigationActive = false\n        rerouteInFlight = false\n        locationComponent?.let { NavigationLocationComponentController.apply(it, false) }',
              'navigationActive = false\n        rerouteInFlight = false\n        locationComponent?.let { NavigationLocationComponentController.apply(it, false) }\n        routeScroll.visibility = View.GONE'
          )
          path.write_text(text)

      - name: Validate patch
        run: |
          grep -q 'MapLibreMapOptions' app/src/main/java/com/haritalar/app/MainActivity.kt
          grep -q 'Konumuma dön' app/src/main/java/com/haritalar/app/MainActivity.kt
          grep -q 'root.addView(routeScroll' app/src/main/java/com/haritalar/app/MainActivity.kt

      - name: Commit and dispatch Android CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/haritalar/app/MainActivity.kt
          git commit -m 'fix(map): enable free browsing and route inspection'
          git rm .github/workflows/one-shot-map-browse-fix.yml
          git commit -m 'chore(ci): remove one-shot map patch workflow'
          git push origin HEAD:main
          gh workflow run android.yml --ref main
