name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unit tests
        run: gradle test --stacktrace

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haritalar-unit-test-reports-${{ github.run_number }}
          path: '**/build/test-results/**/*.xml'
          if-no-files-found: warn
          retention-days: 30

      - name: Android instrumentation smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: gradle connectedDebugAndroidTest --stacktrace

      - name: Capture Android instrumentation diagnostics
        if: always()
        run: |
          mkdir -p app/build/ci-diagnostics
          timeout 30s adb devices -l > app/build/ci-diagnostics/adb-devices.txt || true
          timeout 30s adb logcat -d -v threadtime > app/build/ci-diagnostics/logcat.txt || true
          timeout 30s find app/build/reports/androidTests -maxdepth 6 -type f -print > app/build/ci-diagnostics/android-test-report-files.txt 2>/dev/null || true

      - name: Upload Android instrumentation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haritalar-android-instrumentation-diagnostics-${{ github.run_number }}
          path: app/build/ci-diagnostics
          if-no-files-found: warn
          retention-days: 30

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: haritalar-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish APK release for every successful main build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.0.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "Haritalar $TAG" \
            --generate-notes

      - name: Publish APK to manually pushed version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "Haritalar ${GITHUB_REF_NAME}" \
            --generate-notes || \
          gh release upload "${GITHUB_REF_NAME}" app/build/outputs/apk/debug/app-debug.apk --clobber
