name: Apply verified traffic map colors

on:
  push:
    paths:
      - .github/workflows/apply-traffic-map-live-colors.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply verified route identity and sampling fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path("app/src/main/java/com/haritalar/app/MainActivity.kt")
          text = main.read_text()

          if 'private var activeRouteSignature: String = ""' not in text:
              anchor = '    private var lastTrafficSegmentsByRoute: Map<String, List<TrafficRouteSegment>> = emptyMap()\n'
              if anchor not in text: raise SystemExit("active route field anchor not found")
              text = text.replace(anchor, anchor + '    private var activeRouteSignature: String = ""\n', 1)

          anchor = '        routePoints = option.points\n        routeCumulativeMeters = option.cumulativeMeters\n'
          if 'activeRouteSignature = routeSignature(option)' not in text:
              if anchor not in text: raise SystemExit("apply route anchor not found")
              text = text.replace(anchor, anchor + '        activeRouteSignature = routeSignature(option)\n', 1)

          old = '''    private fun routeSignatureForCurrentRoute(): String =
        if (routePoints.isEmpty()) "" else routeSignature(
            RouteOption(
                title = "",
                subtitle = "",
                points = routePoints,
                cumulativeMeters = routeCumulativeMeters,
                totalMeters = routeTotalMeters,
                distanceKm = routeTotalMeters / 1000.0,
                durationSeconds = 0.0,
                toll = false,
                tollAmountTry = null,
                tollName = null,
                ferryUsed = false,
                maneuvers = currentManeuvers,
            ),
        )
'''
          new = '''    private fun routeSignatureForCurrentRoute(): String =
        activeRouteSignature.ifBlank {
            if (routePoints.isEmpty()) "" else routeSignature(
                RouteOption(
                    title = "",
                    subtitle = "",
                    points = routePoints,
                    cumulativeMeters = routeCumulativeMeters,
                    totalMeters = routeTotalMeters,
                    distanceKm = routeTotalMeters / 1000.0,
                    durationSeconds = 0.0,
                    toll = false,
                    tollAmountTry = null,
                    tollName = null,
                    ferryUsed = false,
                    maneuvers = currentManeuvers,
                ),
            )
        }
'''
          if old in text: text = text.replace(old, new, 1)
          main.write_text(text)

          service = Path("core/src/main/kotlin/com/haritalar/core/traffic/TrafficRouteRankingService.kt")
          text = service.read_text()
          old = '                    route = TrafficRoute(points),\n'
          if old in text: text = text.replace(old, '                    route = TrafficRoute(route.coordinates),\n', 1)
          service.write_text(text)
          PY

      - name: Verify source changes
        run: |
          grep -q 'activeRouteSignature' app/src/main/java/com/haritalar/app/MainActivity.kt
          grep -q 'route = TrafficRoute(route.coordinates)' core/src/main/kotlin/com/haritalar/core/traffic/TrafficRouteRankingService.kt
          git diff --check

      - name: Commit source fix and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/haritalar/app/MainActivity.kt core/src/main/kotlin/com/haritalar/core/traffic/TrafficRouteRankingService.kt
          git rm .github/workflows/apply-traffic-map-live-colors.yml .github/workflows/fix-traffic-route-render-chain.yml || true
          git commit -m "fix(traffic): preserve active route identity for live colors"
          git push origin main
