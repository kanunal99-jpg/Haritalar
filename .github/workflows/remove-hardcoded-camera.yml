name: One-time remove hardcoded startup camera

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove hardcoded Istanbul startup camera
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/haritalar/app/MainActivity.kt')
          s = p.read_text()
          old = '''                map.cameraPosition = CameraPosition.Builder()\n                    .target(LatLng(41.0082, 28.9784))\n                    .zoom(11.5)\n                    .build()\n'''
          if old not in s:
              raise SystemExit('expected hardcoded startup camera block not found')
          p.write_text(s.replace(old, ''))
          PY
      - name: Commit change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/haritalar/app/MainActivity.kt
          git commit -m 'fix(map): remove hardcoded Istanbul startup camera'
          git push origin HEAD:main
      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/remove-hardcoded-camera.yml
          git commit -m 'chore(ci): remove one-time camera patch workflow'
          git push origin HEAD:main
